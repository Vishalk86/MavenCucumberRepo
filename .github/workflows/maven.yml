name: Maven CI
on:
 push:
   branches: [ feature_branch ]
jobs:
 build:
   runs-on: ubuntu-latest
   steps:
     - name: Checkout code
       uses: actions/checkout@v4
     - name: Setup Java
       uses: actions/setup-java@v4
       with:
         distribution: temurin
         java-version: '17'
     - name: Build Project
       run: mvn clean test
